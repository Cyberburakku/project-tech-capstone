<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF6EE" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Project TECH" />
    <link rel="preload" as="image" href="/art/maine-sunrise.jpg" fetchpriority="high" />
    <meta
      name="description"
      content="Project T.E.C.H. — Tools, Education, Connectivity, Hope. A free, judgment-free reentry readiness coach for people preparing for release."
    />
    <script>
      // Apply the saved or device theme (and paused motion) before first paint.
      (function () {
        try {
          var t = localStorage.getItem("project-tech:theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          if (t === "dark") {
            document.documentElement.classList.add("dark");
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#141B1D");
          }
          var still = localStorage.getItem("project-tech:still");
          if (still === "true" || (still === null && window.matchMedia("(prefers-reduced-motion: reduce)").matches)) {
            document.documentElement.classList.add("still");
          }
        } catch (e) {}
      })();
    </script>
    <title>Second Take</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
